<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>麺屋 ほのか</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;background:#faf6ef;color:#2b1d14;line-height:1.8}
  header{background:#1d1410;color:#fff;text-align:center;padding:90px 16px}
  header h1{font-size:clamp(40px,9vw,72px);letter-spacing:.2em}
  header p{color:#e8b04b;margin-top:12px;letter-spacing:.3em}
  section{max-width:720px;margin:0 auto;padding:56px 16px}
  h2{font-size:24px;border-bottom:2px solid #b8352a;display:inline-block;margin-bottom:24px}
  .menu{list-style:none}
  .menu li{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px dashed #c9b9a3}
  .menu span:last-child{color:#b8352a;font-weight:bold}
  dl{display:grid;grid-template-columns:5em 1fr;gap:8px}
  footer{text-align:center;padding:24px;font-size:12px;color:#8a7a6a}

</head>
<body>
<header>

<section>

  <ul class="menu">
    <li><span>鶏白湯らーめん</span><span>950円</span></li>

    <li><span>辛味噌鶏白湯</span><span>1,050円</span></li>
    <li><span>味玉</span><span>150円</span></li>
    <li><span>ライス</span><span>100円</span></li>
  </ul>
</section>
<section>
  <h2>店舗情報</h2>
  <dl>
    <dt>営業時間</dt><dd>11:00〜15:00 / 18:00〜22:00</dd>
    <dt>定休日</dt><dd>水曜日</dd>
    <dt>席数</dt><dd>カウンター10席</dd>
  </dl>
</section>
<footer>※テスト用の架空の店舗です</footer>

</html>
